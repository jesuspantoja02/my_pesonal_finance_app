name: my_personal_finance_app
description: "Finanza — personal finance app with local-first data and optional Firebase auth."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  drift: ^2.22.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.2
  google_fonts: ^6.2.1
  animate_do: ^4.2.0
  uuid: ^4.5.1
  package_info_plus: ^10.2.2
  fl_chart: ^0.70.2
  share_plus: ^13.3.1
  local_auth: ^2.3.0
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.1.0
  crypto: ^3.0.6
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0
  cloud_functions: ^6.5.0
  sign_in_with_apple: ^8.2.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#047857"
  adaptive_icon_foreground: assets/icon/app_icon.png
  remove_alpha_ios: false
  background_color_ios: "#047857"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/wallets/
    - assets/banks/
